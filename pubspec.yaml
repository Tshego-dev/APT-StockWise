name: stockwise
description: Smart Inventory & Expiry Management for Beauty Supply Shops
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Connectivity
  connectivity_plus: ^6.0.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
